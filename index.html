<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ژمێریاری نرخ و قازانجی زێڕ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'system-ui', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
    }
    /* Style for the disabled loading state */
    input:disabled {
      cursor: not-allowed;
      background-color: #f3f4f6;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">
  <div class="max-w-2xl mx-auto p-4 sm:p-6">
    <div class="bg-white shadow-2xl rounded-xl p-6">
      <h1 class="text-3xl font-bold text-center text-yellow-600 mb-6">ژمێریاری نرخ و قازانجی زێڕ</h1>

      <!-- Global Inputs -->
      <div class="space-y-4 mb-6">
        <div>
          <div class="flex justify-between items-center mb-2">
            <label for="ouncePrice" class="font-medium text-gray-700">نرخی یەک ئۆنسە زێڕی عەیارە ٢٤ (بە دۆلار)</label>
            <span id="priceStatus" class="text-xs text-gray-500 font-normal"></span>
          </div>
          <input type="number" step="0.01" id="ouncePrice" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-yellow-400 text-lg" value="3448" />
        </div>
        <div>
          <label for="dollarRate" class="block mb-2 font-medium text-gray-700">نرخی ١٠٠ دۆلار (بە دیناری عێراقی)</label>
          <input type="text" id="dollarRate" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-yellow-400 text-lg" value="142,000" />
        </div>
      </div>

      <!-- Tabs -->
      <div class="flex justify-center border-b border-gray-200 mb-6">
        <button id="calcTab" class="px-6 py-2 text-lg font-semibold text-yellow-600 border-b-2 border-yellow-600">نرخەکان</button>
        <button id="profitTab" class="px-6 py-2 text-lg font-semibold text-gray-500 border-b-2 border-transparent hover:text-yellow-600 transition-colors">قازانج</button>
      </div>

      <!-- Price Calculator Tab -->
      <div id="calculator">
        <button id="btnCalc" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 rounded-lg shadow-md transition-transform transform hover:scale-105 text-lg">نوێکردنەوەی نرخەکان</button>
      </div>

      <!-- Profit Calculator Tab -->
      <div id="profitCalculator" class="hidden">
        <div class="space-y-4">
          <div>
            <label for="buyPriceMithqalIQD" class="block mb-2 font-medium text-gray-700">نرخی کڕینی یەک مسقاڵ (بە دینار)</label>
            <input type="text" id="buyPriceMithqalIQD" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="بۆ نموونە: 450,000" />
          </div>
          <div>
            <label for="sellPriceMithqalIQD" class="block mb-2 font-medium text-gray-700">نرخی فرۆشتنی یەک مسقاڵ (بە دینار)</label>
            <input type="text" id="sellPriceMithqalIQD" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-red-400" placeholder="بۆ نموونە: 455,000" />
          </div>
          <div>
            <label for="quantity" class="block mb-2 font-medium text-gray-700">ژمارەی مسقاڵ</label>
            <input type="number" id="quantity" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-yellow-400" value="10" />
          </div>
          <button id="btnProfit" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg shadow-md transition-transform transform hover:scale-105 text-lg">ژماردنی قازانج</button>
        </div>
      </div>

      <!-- Results Display -->
      <div id="results" class="mt-6"></div>
    </div>
  </div>

  <script>
    // --- DOM Elements ---
    const calcTab = document.getElementById('calcTab');
    const profitTab = document.getElementById('profitTab');
    const calculatorDiv = document.getElementById('calculator');
    const profitCalculatorDiv = document.getElementById('profitCalculator');
    const resultsDiv = document.getElementById('results');
    const ouncePriceInput = document.getElementById('ouncePrice');
    const dollarRateInput = document.getElementById('dollarRate');
    const priceStatusSpan = document.getElementById('priceStatus');

    // --- Constants ---
    const OUNCE_TO_GRAM = 31.10347;
    const MITHQAL_TO_GRAM = 5;

    // --- State ---
    let lastCalculatedMithqal21IQD = 0;
    
    // --- Utility Functions ---
    function numberWithCommas(num) {
      if (num === null || num === undefined) return "";
      let parts = num.toString().split(".");
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return parts.join(".");
    }

    function setupCommaFormatting(id) {
      const input = document.getElementById(id);
      input.addEventListener('input', function(e) {
        let value = e.target.value.replace(/,/g, '');
        if (!isNaN(value) && value.length > 0) {
          e.target.value = numberWithCommas(parseFloat(value));
        } else if (value === '') {
           e.target.value = '';
        }
      });
    }

    // --- Tab Management ---
    function setActiveTab(activeTab) {
      [calcTab, profitTab].forEach(tab => {
        const isActive = tab === activeTab;
        tab.classList.toggle('text-yellow-600', isActive);
        tab.classList.toggle('border-yellow-600', isActive);
        tab.classList.toggle('text-gray-500', !isActive);
        tab.classList.toggle('border-transparent', !isActive);
      });
      calculatorDiv.classList.toggle('hidden', activeTab !== calcTab);
      profitCalculatorDiv.classList.toggle('hidden', activeTab !== profitTab);
      resultsDiv.innerHTML = '';

      if (activeTab === calcTab) {
        calculateAndDisplayPrices();
      } else if (activeTab === profitTab) {
        const buyInput = document.getElementById('buyPriceMithqalIQD');
        if (lastCalculatedMithqal21IQD > 0) {
          buyInput.value = numberWithCommas(Math.round(lastCalculatedMithqal21IQD));
        }
      }
    }

    // --- Event Listeners ---
    calcTab.onclick = () => setActiveTab(calcTab);
    profitTab.onclick = () => setActiveTab(profitTab);
    
    document.getElementById('btnCalc').onclick = calculateAndDisplayPrices;
    document.getElementById('btnProfit').onclick = calculateAndDisplayProfit;
    
    ouncePriceInput.addEventListener('input', calculateAndDisplayPrices);
    dollarRateInput.addEventListener('input', calculateAndDisplayPrices);

    // --- API and Calculation Logic ---
    async function fetchGoldPrice() {
      ouncePriceInput.disabled = true;
      ouncePriceInput.value = "...نرخ وەردەگیرێت";
      priceStatusSpan.textContent = "چاوەڕوانبە...";

      try {
        const response = await fetch('https://api.gold-api.com/price/XAU');
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        const data = await response.json();
        
        ouncePriceInput.value = data.price.toFixed(2);
        priceStatusSpan.textContent = `نوێکرایەوە: ${data.updatedAtReadable}`;
        priceStatusSpan.classList.remove('text-red-500');

      } catch (error) {
        console.error("Failed to fetch gold price:", error);
        ouncePriceInput.value = "3448"; // Fallback value
        priceStatusSpan.textContent = "نرخی بنەڕەت بەکاردێت";
        priceStatusSpan.classList.add('text-red-500');

      } finally {
        ouncePriceInput.disabled = false;
        // Trigger the calculation with the new (or fallback) price
        calculateAndDisplayPrices();
      }
    }

    function getGlobalInputs() {
      const ouncePrice = parseFloat(ouncePriceInput.value) || 0;
      const dollarRateRaw = dollarRateInput.value.replace(/,/g, '');
      const dollarRate = parseFloat(dollarRateRaw) || 0;
      return { ouncePrice, dollarRate };
    }

    function calculateAndDisplayPrices() {
      if (calculatorDiv.classList.contains('hidden')) return;
      
      const { ouncePrice, dollarRate } = getGlobalInputs();

      if (ouncePrice === 0 || dollarRate === 0) {
        resultsDiv.innerHTML = `<div class="p-4 bg-red-50 text-red-700 rounded-lg text-center">تکایە خانەکانی سەرەوە بە دروستی پڕ بکەرەوە.</div>`;
        return;
      }

      const rate = dollarRate / 100;
      const toIQD = (usd_price) => numberWithCommas(Math.round(usd_price * rate));

      const gram24_usd = ouncePrice / OUNCE_TO_GRAM;
      const gram21_usd = gram24_usd * (21 / 24);
      const mithqal24_usd = gram24_usd * MITHQAL_TO_GRAM;
      const mithqal21_usd = gram21_usd * MITHQAL_TO_GRAM;
      const kilo24_usd = gram24_usd * 1000;
      const kilo21_usd = gram21_usd * 1000;
      
      lastCalculatedMithqal21IQD = mithqal21_usd * rate;

      resultsDiv.innerHTML = `
        <div class="space-y-6">
          <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg">
            <div class="flex justify-between items-center mb-4">
              <h3 class="text-xl font-bold text-gray-800">وردەکاری نرخەکان</h3>
              <button onclick="copyPricesToClipboard(event)" id="copyPrices" class="flex items-center gap-2 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                <span>کۆپی کردن</span>
              </button>
            </div>
            <div class="space-y-3 text-base">
              <div class="grid grid-cols-3 gap-2 items-center"><span class="font-bold">عەیارە ٢١</span><span class="text-center font-semibold text-gray-700">نرخ بە دۆلار</span><span class="text-center font-semibold text-yellow-700">نرخ بە دینار</span></div>
              <div class="grid grid-cols-3 gap-2 py-2 border-t"><span>گرام:</span><span class="text-center">$${gram21_usd.toFixed(2)}</span><span class="text-center">${toIQD(gram21_usd)}</span></div>
              <div class="grid grid-cols-3 gap-2 py-2 border-t bg-yellow-50 rounded"><span>مسقاڵ:</span><span class="text-center font-bold">$${mithqal21_usd.toFixed(2)}</span><span class="text-center font-bold">${toIQD(mithqal21_usd)}</span></div>
              <div class="grid grid-cols-3 gap-2 py-2 border-t"><span>لیرە:</span><span class="text-center">$${(mithqal21_usd * 1.5).toFixed(2)}</span><span class="text-center">${toIQD(mithqal21_usd * 1.5)}</span></div>
              <div class="grid grid-cols-3 gap-2 py-2 border-t"><span>کیلۆ:</span><span class="text-center">$${numberWithCommas(kilo21_usd.toFixed(2))}</span><span class="text-center">${toIQD(kilo21_usd)}</span></div>
              <div class="grid grid-cols-3 gap-2 items-center mt-4"><span class="font-bold">عەیارە ٢٤</span><span class="text-center font-semibold text-gray-700">نرخ بە دۆلار</span><span class="text-center font-semibold text-yellow-700">نرخ بە دینار</span></div>
              <div class="grid grid-cols-3 gap-2 py-2 border-t"><span>گرام:</span><span class="text-center">$${gram24_usd.toFixed(2)}</span><span class="text-center">${toIQD(gram24_usd)}</span></div>
              <div class="grid grid-cols-3 gap-2 py-2 border-t"><span>مسقاڵ:</span><span class="text-center">$${mithqal24_usd.toFixed(2)}</span><span class="text-center">${toIQD(mithqal24_usd)}</span></div>
              <div class="grid grid-cols-3 gap-2 py-2 border-t"><span>لیرە:</span><span class="text-center">$${(mithqal24_usd * 1.5).toFixed(2)}</span><span class="text-center">${toIQD(mithqal24_usd * 1.5)}</span></div>
              <div class="grid grid-cols-3 gap-2 py-2 border-t"><span>کیلۆ:</span><span class="text-center">$${numberWithCommas(kilo24_usd.toFixed(2))}</span><span class="text-center">${toIQD(kilo24_usd)}</span></div>
            </div>
          </div>
          <div class="p-4 bg-blue-50 border border-blue-200 rounded-lg">
              <h3 class="text-xl font-bold text-gray-800 mb-4">گۆڕینی دۆلار بۆ مسقاڵ</h3>
              <div class="flex items-center gap-4">
                  <div class="flex-1">
                      <label for="usdAmountQuickCalc" class="block text-sm font-medium text-gray-600 mb-1">بڕی دۆلار</label>
                      <input type="text" id="usdAmountQuickCalc" value="10,000" class="w-full p-2 border border-gray-300 rounded-md text-center text-lg font-bold">
                  </div>
                  <div class="pt-6 text-2xl text-gray-400">&rarr;</div>
                  <div class="flex-1 text-center">
                      <div class="text-sm font-medium text-gray-600 mb-1">یه‌کسانه‌ به‌ (مسقاڵ زێڕی ٢١)</div>
                      <div id="mithqalResult" class="w-full p-2 bg-white rounded-md text-blue-700 font-bold text-2xl"></div>
                  </div>
              </div>
          </div>
        </div>
      `;

      const usdAmountInput = document.getElementById('usdAmountQuickCalc');
      const mithqalResultDiv = document.getElementById('mithqalResult');
      setupCommaFormatting('usdAmountQuickCalc');

      const updateMithqalCalc = () => {
          const amountRaw = usdAmountInput.value.replace(/,/g, '');
          const amount = parseFloat(amountRaw) || 0;
          const mithqals = (amount / mithqal21_usd).toFixed(2);
          mithqalResultDiv.textContent = mithqals;
      };

      usdAmountInput.addEventListener('input', updateMithqalCalc);
      updateMithqalCalc();
    }

    function calculateAndDisplayProfit() {
      const buyPriceRaw = document.getElementById('buyPriceMithqalIQD').value.replace(/,/g, '');
      const sellPriceRaw = document.getElementById('sellPriceMithqalIQD').value.replace(/,/g, '');
      const qtyMithqal = parseFloat(document.getElementById('quantity').value) || 0;

      const buyPriceIQD = parseFloat(buyPriceRaw) || 0;
      const sellPriceIQD = parseFloat(sellPriceRaw) || 0;

      if (buyPriceIQD === 0 || sellPriceIQD === 0 || qtyMithqal === 0) {
        resultsDiv.innerHTML = `<div class="p-4 bg-red-50 text-red-700 rounded-lg text-center">تکایە هەموو خانەکان بە دروستی پڕ بکەرەوە.</div>`;
        return;
      }

      const profitPerMithqal_IQD = sellPriceIQD - buyPriceIQD;
      const totalProfit_IQD = profitPerMithqal_IQD * qtyMithqal;

      const profitSign = totalProfit_IQD >= 0 ? 'text-green-600' : 'text-red-600';
      const profitLabel = totalProfit_IQD >= 0 ? 'قازانج' : 'زیان';

      resultsDiv.innerHTML = `
        <div class="p-4 bg-green-50 border border-green-200 rounded-lg space-y-3 text-lg">
          <h3 class="text-xl font-bold text-gray-800 mb-3">ئەنجامی مامەڵەکەت</h3>
          <div class="flex justify-between"><span>قازانجی یەک مسقاڵ:</span> <strong>${numberWithCommas(profitPerMithqal_IQD)} دینار</strong></div>
          <hr class="border-green-200">
          <div class="flex justify-between items-center text-xl font-bold ${profitSign}">
            <span>کۆی گشتی ${profitLabel} (${qtyMithqal} مسقاڵ):</span>
            <span>${numberWithCommas(totalProfit_IQD)} دینار</span>
          </div>
        </div>
      `;
    }

    // --- Copy Prices Function ---
    async function copyPricesToClipboard(event) {
      event.preventDefault();
      console.log('Copy function triggered'); // Debug log
      
      const { ouncePrice, dollarRate } = getGlobalInputs();
      if (ouncePrice === 0 || dollarRate === 0) {
        alert('تکایە دڵنیابە لە نرخی ئۆنسە و دۆلار');
        return;
      }

      const rate = dollarRate / 100;
      const toIQD = (usd_price) => numberWithCommas(Math.round(usd_price * rate));

      const gram24_usd = ouncePrice / OUNCE_TO_GRAM;
      const gram21_usd = gram24_usd * (21 / 24);
      const mithqal24_usd = gram24_usd * MITHQAL_TO_GRAM;
      const mithqal21_usd = gram21_usd * MITHQAL_TO_GRAM;

      // Format current date in Kurdish
      const now = new Date();
      const kurdishDays = ['یەکشەممە', 'دووشەممە', 'سێشەممە', 'چوارشەممە', 'پێنجشەممە', 'هەینی', 'شەممە'];
      let dateStr;
      try {
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();
        const dayName = kurdishDays[now.getDay()];
        const hour = String(now.getHours()).padStart(2, '0');
        const minute = String(now.getMinutes()).padStart(2, '0');
        
        dateStr = `${day}/${month}/${year}\n${dayName}\n${hour}:${minute}`;
      } catch (e) {
        // Fallback date format if Kurdish locale isn't available
        dateStr = now.toLocaleString();
      }

      // Prepare the text to be copied
      const textToCopy = `نرخی زێڕ
${dateStr}
--------------------------------
عەیارە ٢١:
• یەک گرام: ${gram21_usd.toFixed(2)}$ / ${toIQD(gram21_usd)} دینار
• یەک مسقاڵ: ${mithqal21_usd.toFixed(2)}$ / ${toIQD(mithqal21_usd)} دینار
• یەک لیرە: ${(mithqal21_usd * 1.5).toFixed(2)}$ / ${toIQD(mithqal21_usd * 1.5)} دینار

عەیارە ٢٤:
• یەک گرام: ${gram24_usd.toFixed(2)}$ / ${toIQD(gram24_usd)} دینار
• یەک مسقاڵ: ${mithqal24_usd.toFixed(2)}$ / ${toIQD(mithqal24_usd)} دینار
• یەک لیرە: ${(mithqal24_usd * 1.5).toFixed(2)}$ / ${toIQD(mithqal24_usd * 1.5)} دینار

نرخی دۆلار: 100$ = ${numberWithCommas(dollarRate)} دینار
--------------------------------`;

      console.log('Attempting to copy:', textToCopy); // Debug log
      
      try {
        // Create a temporary textarea
        const textArea = document.createElement('textarea');
        textArea.value = textToCopy;
        
        // Make it invisible but keep it in the viewport
        textArea.style.position = 'fixed';
        textArea.style.top = '0';
        textArea.style.left = '0';
        textArea.style.opacity = '0';
        
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        
        // Try to copy
        const successful = document.execCommand('copy');
        if (!successful) throw new Error('Copy command failed');
        
        // Remove the textarea
        document.body.removeChild(textArea);
        
        // Show success message
        const copyBtn = document.getElementById('copyPrices');
        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        <span>کۆپی کرا!</span>`;
        copyBtn.classList.remove('bg-gray-100', 'hover:bg-gray-200', 'text-gray-700');
        copyBtn.classList.add('bg-green-100', 'text-green-700');
        
        setTimeout(() => {
          copyBtn.innerHTML = originalText;
          copyBtn.classList.remove('bg-green-100', 'text-green-700');
          copyBtn.classList.add('bg-gray-100', 'hover:bg-gray-200', 'text-gray-700');
        }, 2000);
      } catch (err) {
        console.error('Failed to copy text: ', err);
        alert('ببورە، کێشەیەک هەیە لە کۆپی کردنی نرخەکان');
        
        // Try alternative clipboard API as fallback
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(textToCopy);
            const copyBtn = document.getElementById('copyPrices');
            copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            <span>کۆپی کرا!</span>`;
            copyBtn.classList.add('bg-green-100', 'text-green-700');
          } catch (clipboardErr) {
            console.error('Clipboard API failed:', clipboardErr);
          }
        }
      }
    }

    // --- Initial Setup ---
    document.addEventListener('DOMContentLoaded', () => {
      setupCommaFormatting('dollarRate');
      setupCommaFormatting('buyPriceMithqalIQD');
      setupCommaFormatting('sellPriceMithqalIQD');
      
      // Set up copy button
      const copyButton = document.getElementById('copyPrices');
      if (copyButton) {
        copyButton.addEventListener('click', copyPricesToClipboard);
      }
      
      // Fetch the live price when the page loads
      fetchGoldPrice();
    });

  </script>
</body>
</html>
